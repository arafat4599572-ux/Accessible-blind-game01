<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F4F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A0F1A" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Accessible Blind Game</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@500;700&display=swap">
<style>
/* Layout: one narrow column, full-width controls at least 60px tall, the screen title always first, board drawn for helpers but hidden from screen readers.
   Type: Atkinson Hyperlegible (made for low vision readers) for everything, its Mono cut for square numbers.
   Color: neutral blue-grey ground, user-chosen primary (button fill) and secondary (rings, rules). Accent is never used as text color. */
:root{
  --bg:#F2F4F9; --surface:#FFFFFF; --surface2:#E6EAF3; --fg:#0B1220; --muted:#3C455A; --line:#7C869C; --soft:#CBD1DE;
  --accent:#FFC93C; --on-accent:#1A1400; --accent2:#0FA3A3;
  --danger:#B3261E; --on-danger:#FFFFFF; --ladder:#1E7F4A; --snake:#C0392B;
  --board-a:#EEF1F8; --board-b:#DDE3F0;
  --font-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-num:"Atkinson Hyperlegible Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A0F1A; --surface:#141B2B; --surface2:#1D2740; --fg:#F5F7FB; --muted:#B7C0D3; --line:#6E7A96; --soft:#2F3A55;
    --danger:#FF8A80; --on-danger:#2B0000; --ladder:#4FD08A; --snake:#FF7A6B;
    --board-a:#19213A; --board-b:#121A2F; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A0F1A; --surface:#141B2B; --surface2:#1D2740; --fg:#F5F7FB; --muted:#B7C0D3; --line:#6E7A96; --soft:#2F3A55;
  --danger:#FF8A80; --on-danger:#2B0000; --ladder:#4FD08A; --snake:#FF7A6B;
  --board-a:#19213A; --board-b:#121A2F; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none;-webkit-text-size-adjust:100%}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;cursor:default}
input,textarea,select{-webkit-user-select:text;user-select:text;cursor:text}
select{cursor:default}
button{font-family:inherit}
body{margin:0;font:400 1.125rem/1.5 var(--font-body);background:var(--bg);color:var(--fg);
  padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:560px;margin-inline:auto}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
p{margin:0 0 12px}
ul,ol{margin:0 0 12px;padding-left:1.3rem}
li{margin:4px 0}
h1:focus,h2:focus,section:focus,[tabindex="-1"]:focus{outline:none}
:focus-visible{outline:4px solid var(--accent2);outline-offset:3px;border-radius:10px}
.lead{color:var(--muted);margin:6px 0 20px}
.muted{color:var(--muted)}
.hint{color:var(--muted);font-size:1rem;margin:4px 0 0}
.note{color:var(--muted);font-size:1rem;margin-top:22px;padding-top:14px;border-top:2px solid var(--soft)}
.err{color:var(--danger);font-weight:700;margin:0 0 12px}
.ok{color:var(--ladder);font-weight:700;margin:12px 0 0}


.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:60px;padding:14px 18px;border-radius:14px;
  border:2px solid var(--line);background:var(--surface);color:var(--fg);font:700 1.15rem/1.25 var(--font-body);text-align:center;cursor:default;transition:filter .12s ease,transform .12s ease;-webkit-appearance:none;appearance:none}
.btn:active{filter:brightness(.9);transform:scale(.985)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn.dangerfill{background:var(--danger);color:var(--on-danger);border-color:transparent}
.btn.left{justify-content:flex-start;text-align:left}
.btn.big{min-height:84px;font-size:1.3rem}
.btn.giant{min-height:104px;font-size:1.7rem}
.btn[aria-disabled="true"]{opacity:.55;cursor:not-allowed}
.btn.back{width:auto;min-height:52px;padding:10px 20px}
.btn .sub{display:block;font-weight:400;font-size:1rem;color:var(--muted);margin-top:2px}
.btn.primary .sub{color:var(--on-accent)}
.btn .col{display:block;min-width:0;overflow-wrap:anywhere}
.topbar{margin-bottom:14px}
.appbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:6px;margin:-20px 0 8px;padding:10px 0 8px;background:var(--bg)}
.abtn{width:56px;height:56px;flex:none;display:grid;place-items:center;border:0;border-radius:50%;background:transparent;color:var(--fg);cursor:default;-webkit-appearance:none;appearance:none;transition:background .12s ease}
.abtn:active{background:var(--surface2)}
.abtn svg{width:28px;height:28px}
.stack{display:flex;flex-direction:column;gap:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
@media (max-width:360px){.row2{grid-template-columns:1fr}}

.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field>label,.check label{font-weight:700}
input[type=text],input[type=email],select,textarea{width:100%;min-height:58px;padding:12px 14px;border-radius:12px;border:2px solid var(--line);
  background:var(--surface);color:var(--fg);font:400 1.15rem/1.4 var(--font-body)}
textarea{min-height:120px;resize:vertical}
input[type=range]{width:100%;min-height:44px;accent-color:var(--accent2)}
.check{display:flex;gap:14px;align-items:center;min-height:56px;margin-bottom:12px}
.check input{width:30px;height:30px;flex:none;accent-color:var(--accent2)}
.check label{font-weight:400}

.toprow{display:flex;gap:12px;margin:20px 0 12px}
.toprow .profile{flex:1;min-width:0}
.iconbtn{width:68px;flex:none;padding:0}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:700;font-size:1.3rem;flex:none}
.badge{margin-left:auto;min-width:34px;height:34px;padding:0 10px;border-radius:17px;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-weight:700}
.home-list{display:flex;flex-direction:column;gap:12px}

dl.facts{margin:0}
dl.facts dt{color:var(--muted);font-size:1rem;margin-top:12px}
dl.facts dd{margin:0;font-weight:700;font-size:1.2rem;overflow-wrap:anywhere}
.levelbox{border:2px solid var(--line);border-radius:14px;padding:16px;background:var(--surface)}
.levelbox .lv{font-size:2.2rem;font-weight:700;line-height:1.1}
progress{width:100%;height:22px;accent-color:var(--accent2);margin:10px 0 6px}
ol.stages{list-style:none;padding:0;margin:0;display:grid;gap:8px}
ol.stages li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;border:2px solid var(--soft);margin:0}
ol.stages .chip{flex:none;min-width:64px;text-align:center;padding:4px 8px;border-radius:10px;font-weight:700;background:var(--surface2)}
ol.stages li.done .chip{background:var(--accent);color:var(--on-accent)}
ol.stages li.cur{border-color:var(--accent2);border-width:3px}
ol.stages li.lock{color:var(--muted)}
ol.stages .st{margin-left:auto;font-size:1rem;color:var(--muted);text-align:right}
.menu{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:12px}
.menu li{margin:0}
.menu .chev{margin-left:auto;font-size:1.6rem;line-height:1}
.noteitem{border-left:6px solid var(--accent2);padding:4px 0 4px 14px;margin:0 0 16px}
.noteitem.unread{border-left-color:var(--fg)}
.noteitem .nt{font-weight:700;font-size:1.1rem;margin:0 0 4px}
.noteitem p{margin:0}

.status{font-size:1.3rem;font-weight:700;margin:12px 0 14px}
.boardwrap{margin:18px 0 6px;border:2px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.boardwrap svg{display:block;width:100%;height:auto;max-width:100%}
.ca{fill:var(--board-a)}.cb{fill:var(--board-b)}.startzone{fill:var(--surface2)}
.num{fill:var(--muted);font:700 2.7px var(--font-num)}
.lad{stroke:var(--ladder);stroke-width:.7;fill:none;stroke-linecap:round}
.snk{stroke:var(--snake);stroke-width:1.6;fill:none;stroke-linecap:round}
.snkhead{fill:var(--snake)}.eye{fill:var(--bg)}
.tok{transition:transform .22s ease}
.tok circle{stroke:var(--fg);stroke-width:.7}
.tok text{font:700 3.6px var(--font-body);text-anchor:middle;dominant-baseline:central}
.t-you{fill:var(--accent)}.tt-you{fill:var(--on-accent)}
.t-B{fill:#2F6FED}.t-C{fill:#1F9D55}.t-D{fill:#8E4EC6}.tt-B,.tt-C,.tt-D{fill:#fff}
.poslist{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.poslist li{display:flex;align-items:center;gap:12px;margin:0;padding:10px 12px;border:2px solid var(--soft);border-radius:12px}
.dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--fg);flex:none}
.d-you{background:var(--accent)}.d-B{background:#2F6FED}.d-C{background:#1F9D55}.d-D{background:#8E4EC6}
.poslist .sq{margin-left:auto;font-family:var(--font-num);font-weight:700;white-space:nowrap}
ol.history{padding-left:1.4rem}
.panel{border:3px solid var(--accent2);border-radius:14px;padding:16px;margin:16px 0;background:var(--surface)}
.group{background:var(--surface);border:2px solid var(--soft);border-radius:16px;padding:16px;margin:14px 0}
.group .levelbox{border:0;padding:0;background:transparent}
.group .field:last-child,.group .check:last-child{margin-bottom:0}
dl.facts dt:first-child{margin-top:0}
.menu+form{margin-top:20px}
.menu .badge+.chev{margin-left:12px}
.lb{list-style:none;padding:0;margin:16px 0 0;display:grid;gap:10px}
.lb li{display:flex;align-items:center;gap:12px;margin:0;padding:12px;border:2px solid var(--soft);border-radius:14px;background:var(--surface)}
.lb li.me{border:3px solid var(--accent2)}
.lb .rk{flex:none;min-width:46px;height:46px;padding:0 8px;border-radius:23px;background:var(--surface2);display:grid;place-items:center;font:700 1.2rem var(--font-num)}
.lb li.top .rk{background:var(--accent);color:var(--on-accent)}
.lb .col{display:block;min-width:0;overflow-wrap:anywhere}
.lb .sub{display:block;color:var(--muted);font-size:1rem}
.ovl{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(5,8,15,.62);padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
.ovl[hidden]{display:none}
.sheet{width:100%;max-width:560px;max-height:85vh;max-height:85dvh;overflow:auto;background:var(--surface);color:var(--fg);border:3px solid var(--accent2);border-radius:18px;padding:18px}
.sheet:focus{outline:none}
.sheet p{margin:0 0 8px}
.sheet ul{margin:0 0 16px}
html{scrollbar-width:none}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none}
@media (prefers-reduced-motion: reduce){.tok{transition:none}.btn,.abtn{transition:none}.btn:active{transform:none}}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
</style>
</head>
<body>
<div class="wrap">
  <main id="view"></main>
  <div id="live" class="sr-only" role="status" aria-live="assertive" aria-atomic="true"></div>
</div>
<div id="upd" class="ovl" hidden>
  <div class="sheet" role="alertdialog" aria-modal="true" aria-label="Update available" aria-describedby="upd-body" tabindex="-1">
    <div id="upd-body"></div>
    <div class="stack"><button type="button" class="btn primary" id="upd-now">Update now</button><button type="button" class="btn" id="upd-later">Later</button></div>
  </div>
</div>

<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s);};
var sleep=function(ms){return new Promise(function(r){setTimeout(r,ms);});};
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};

/*BOARDS-START*/
var BOARDS={
  classic:{name:'Classic board',blurb:'A balanced mix of ladders and snakes.',
    ladders:{2:23,7:29,15:37,22:41,34:55,45:64,53:74,69:90,77:97},
    snakes:{27:5,39:18,48:26,58:36,66:44,72:51,81:60,88:67,94:73,98:79}},
  gentle:{name:'Gentle board',blurb:'More ladders than snakes. A relaxed game.',
    ladders:{3:24,9:31,14:35,20:42,26:57,33:54,49:71,60:82,70:92},
    snakes:{36:17,56:38,75:53,91:69,97:79}},
  steep:{name:'Steep board',blurb:'Few ladders and many snakes. Expect big falls.',
    ladders:{5:26,12:38,24:45,41:58,52:73,67:86,78:95},
    snakes:{16:3,30:8,37:13,46:25,53:32,59:40,65:44,74:54,83:62,89:69,93:72,98:76}}
};
function sqXY(n){var i=n-1,r=Math.floor(i/10),c=(r%2===0)?i%10:9-(i%10);return {x:c*10+5,y:(9-r)*10+5};}
function takeTurn(board,pos,roll){
  var landed=pos+roll;
  if(landed>=100){return {from:pos,roll:roll,landed:100,final:100,event:null,won:true};}
  var ev=null,fin=landed;
  if(board.ladders[landed]){ev='ladder';fin=board.ladders[landed];}
  else if(board.snakes[landed]){ev='snake';fin=board.snakes[landed];}
  return {from:pos,roll:roll,landed:landed,final:fin,event:ev,won:fin>=100};
}
/*BOARDS-END*/

/* ---------- storage (per browser, wrapped in try/catch) ---------- */
var KEY='abg-v2';
var APP_VERSION='2.0';
var VERSION_URL='version.json';
function loadDB(){try{var t=localStorage.getItem(KEY);if(t){return JSON.parse(t);}}catch(e){}return {};}
var DB=loadDB();
DB.profiles=DB.profiles||{};
DB.session=DB.session||null;
DB.read=DB.read||[];
DB.setup=Object.assign({board:'classic',robot:'B'},DB.setup||{});
DB.settings=Object.assign({primary:'sunflower',secondary:'teal',voice:false,commentary:true,sound:true,rate:'normal',volume:80},DB.settings||{});
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){}}

/* ---------- constants ---------- */
var PRIMARY={
  sunflower:{name:'Sunflower yellow',bg:'#FFC93C',fg:'#1A1400'},
  sky:{name:'Sky blue',bg:'#5AAEFF',fg:'#00152E'},
  mint:{name:'Mint green',bg:'#3DDC97',fg:'#00240F'},
  coral:{name:'Coral red',bg:'#FF7B6B',fg:'#2E0600'},
  lavender:{name:'Lavender',bg:'#BBA3FF',fg:'#170040'}
};
var SECONDARY={
  teal:{name:'Teal',c:'#0FA3A3'},magenta:{name:'Magenta',c:'#D6307F'},green:{name:'Green',c:'#3E9B3E'},
  orange:{name:'Orange',c:'#E8730C'},indigo:{name:'Indigo',c:'#5B5BD6'}
};
var PROVIDERS={email:'Email',phone:'Phone number'};
var STAGES=['Beginner','Explorer','Climber','Pathfinder','Strategist','Navigator','Veteran','Master','Champion','Legend'];
var WINS_PER_LEVEL=10;
var ORD=['first','second','third','fourth'];
var STATIC_NOTES=[
  {id:'u-v2',kind:'update',title:'Version 2.0',body:'Leaderboard added in Explore after How to Play. A new Updates option shows what is new and lets you choose Update now or Later. Cleaner screens with no headings or banner.'},
  {id:'n-welcome',kind:'new',title:'Welcome to Accessible Blind Game',body:'Everything works by sound and with a screen reader. Start with Play vs Robot.'},
  {id:'n-levels',kind:'new',title:'How levels work',body:'Win 10 games in first place to reach the next level. Losing never lowers your level.'},
  {id:'u-v1',kind:'update',title:'Version 1.0',body:'Snakes and Ladders against a robot is ready. Three boards to choose from.'},
  {id:'u-online',kind:'update',title:'Online multiplayer',body:'Online multiplayer is coming in a later update.'},
  {id:'u-sound',kind:'update',title:'Sound and voice settings',body:'Change voice speed, volume and sound effects in Settings under Explore.'}
];

/* ---------- helpers ---------- */
function me(){return DB.session?DB.profiles[DB.session]:null;}
function levelOf(p){return 1+Math.floor(p.wins/WINS_PER_LEVEL);}
function stageOf(l){return STAGES[Math.min(l,STAGES.length)-1];}
function newNotes(p){return (p.alerts||[]).concat(STATIC_NOTES.filter(function(n){return n.kind==='new';}));}
function unreadCount(p){return newNotes(p).filter(function(n){return DB.read.indexOf(n.id)<0;}).length;}
function posText(pos){return pos===0?'at the start':'on square '+pos;}
function applyTheme(){
  var r=document.documentElement.style,p=PRIMARY[DB.settings.primary]||PRIMARY.sunflower,s=SECONDARY[DB.settings.secondary]||SECONDARY.teal;
  r.setProperty('--accent',p.bg);r.setProperty('--on-accent',p.fg);r.setProperty('--accent2',s.c);
}

/* ---------- audio: sound effects ---------- */
var actx=null;
function ac(){
  if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){actx=null;}}
  if(actx&&actx.state==='suspended'){try{actx.resume();}catch(e){}}
  return actx;
}
function tone(freq,at,dur,type,vol,pan,endFreq){
  if(!DB.settings.sound){return;}
  var c=ac();if(!c){return;}
  var t=c.currentTime+at,o=c.createOscillator(),g=c.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(freq,t);
  if(endFreq){o.frequency.exponentialRampToValueAtTime(endFreq,t+dur);}
  var v=Math.max((vol||0.2)*(DB.settings.volume/100),0.0002);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);
  if(c.createStereoPanner&&pan){var p=c.createStereoPanner();p.pan.value=pan;g.connect(p);p.connect(c.destination);}
  else{g.connect(c.destination);}
  o.start(t);o.stop(t+dur+0.05);
}
var sfx={
  roll:function(){for(var i=0;i<9;i++){tone(260+Math.random()*420,i*0.075,0.06,'square',0.12);}},
  step:function(i){tone(480+i*55,0,0.09,'triangle',0.22);},
  ladder:function(){[392,494,587,784].forEach(function(f,i){tone(f,i*0.11,0.16,'triangle',0.25);});},
  snake:function(){tone(640,0,0.8,'sawtooth',0.18,0,120);},
  win:function(){[523,659,784,1047].forEach(function(f,i){tone(f,i*0.14,0.3,'triangle',0.28);});tone(1047,0.6,0.7,'sine',0.25);},
  lose:function(){[392,349,311,262].forEach(function(f,i){tone(f,i*0.2,0.3,'sine',0.25);});},
  error:function(){tone(170,0,0.18,'square',0.15);},
  chime:function(){tone(660,0,0.15,'sine',0.2);tone(880,0.12,0.2,'sine',0.2);}
};

/* ---------- audio: speech (built-in voice, or the screen reader through a live region) ---------- */
var lastSpoken='';
function rateNum(){return {slow:0.8,normal:1,fast:1.3}[DB.settings.rate]||1;}
function estMs(t){return Math.max(900,t.length*68/rateNum());}
function live(t){var el=$('#live');if(!el){return;}el.textContent='';setTimeout(function(){el.textContent=t;},40);}
var COMM=false; /* true while the game screen is open: a warm female commentator voice */
var voiceCache=null;
function pickVoice(){
  if(!('speechSynthesis' in window)){return null;}
  var vs=window.speechSynthesis.getVoices()||[];if(!vs.length){return null;}
  if(voiceCache&&vs.indexOf(voiceCache)>=0){return voiceCache;}
  var en=vs.filter(function(v){return /^en/i.test(v.lang);});
  var male=/\bmale\b|david|mark|george|daniel|james|alex|fred|guy|ryan|thomas|oliver/i;
  var fem=/female|zira|samantha|karen|moira|tessa|victoria|susan|hazel|jenny|aria|libby|sonia|natasha|serena|fiona|catherine|sfg|google us english/i;
  var pool=en.filter(function(v){return !male.test(v.name);});
  voiceCache=pool.filter(function(v){return fem.test(v.name+' '+v.voiceURI);})[0]||pool.filter(function(v){return /en[-_]US/i.test(v.lang);})[0]||pool[0]||en[0]||null;
  return voiceCache;
}
try{if('speechSynthesis' in window){window.speechSynthesis.onvoiceschanged=function(){voiceCache=null;};}}catch(e){}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function say(text){
  lastSpoken=text;
  return new Promise(function(res){
    /* In a game the commentator always speaks with its own voice, even when TalkBack is on. Elsewhere the app speaks only when the person is not using a screen reader. */
    var can=(COMM?DB.settings.commentary:DB.settings.voice)&&('speechSynthesis' in window)&&window.SpeechSynthesisUtterance;
    if(!can){live(text);setTimeout(res,estMs(text));return;}
    var u=new SpeechSynthesisUtterance(text),done=false;
    u.lang='en-US';u.rate=rateNum();u.volume=Math.max(0,Math.min(1,DB.settings.volume/100));
    if(COMM){var cv=pickVoice();if(cv){u.voice=cv;u.lang=cv.lang;}u.pitch=1.25;u.rate=Math.min(1.6,rateNum()*1.05);}
    function fin(){if(done){return;}done=true;res();}
    u.onend=fin;u.onerror=fin;
    setTimeout(fin,estMs(text)*2.5+2500);
    try{window.speechSynthesis.speak(u);}catch(e){fin();}
  });
}

  var h=$('#view h1');if(h){h.focus();}
  if(v.hint&&route!=='game'&&DB.settings.voice){announce(v.title+'. '+v.hint);}

/* ---------- game ---------- */
function ladderSVG(a,z){
  var A=sqXY(a),Z=sqXY(z),dx=Z.x-A.x,dy=Z.y-A.y,len=Math.sqrt(dx*dx+dy*dy),ux=dx/len,uy=dy/len,px=-uy*1.2,py=ux*1.2;
  var s='<path class="lad" d="M'+(A.x+px)+' '+(A.y+py)+'L'+(Z.x+px)+' '+(Z.y+py)+'M'+(A.x-px)+' '+(A.y-py)+'L'+(Z.x-px)+' '+(Z.y-py);
  var n=Math.max(2,Math.floor(len/4.5));
  for(var k=1;k<=n;k++){var f=k/(n+1),cx=A.x+dx*f,cy=A.y+dy*f;s+='M'+(cx+px)+' '+(cy+py)+'L'+(cx-px)+' '+(cy-py);}
  return s+'"/>';
}
function snakeSVG(a,z){
  var A=sqXY(a),Z=sqXY(z),dx=Z.x-A.x,dy=Z.y-A.y,len=Math.sqrt(dx*dx+dy*dy),nx=-dy/len,ny=dx/len,o=len*0.2;
  var c1x=A.x+dx*0.33+nx*o,c1y=A.y+dy*0.33+ny*o,c2x=A.x+dx*0.66-nx*o,c2y=A.y+dy*0.66-ny*o;
  return '<path class="snk" d="M'+A.x+' '+A.y+'C'+c1x+' '+c1y+' '+c2x+' '+c2y+' '+Z.x+' '+Z.y+'"/>'+
    '<circle class="snkhead" cx="'+A.x+'" cy="'+A.y+'" r="2.2"/><circle class="eye" cx="'+(A.x-0.8)+'" cy="'+(A.y-0.6)+'" r=".45"/><circle class="eye" cx="'+(A.x+0.8)+'" cy="'+(A.y-0.6)+'" r=".45"/>';
}
function tokXY(pl,idx){
  if(pl.pos===0){return {x:22+idx*9,y:105};}
  var c=sqXY(pl.pos);return {x:c.x+(idx%2)*3.4-1.7,y:c.y+Math.floor(idx/2)*3.4-1.7+1};
}
function boardSVG(g){
  var b=BOARDS[g.boardKey],s='<svg viewBox="0 0 100 110" role="presentation" focusable="false" aria-hidden="true">';
  for(var n=1;n<=100;n++){var i=n-1,r=Math.floor(i/10),c=(r%2===0)?i%10:9-(i%10),x=c*10,y=(9-r)*10;
    s+='<rect class="'+((r+c)%2?'cb':'ca')+'" x="'+x+'" y="'+y+'" width="10" height="10"/><text class="num" x="'+(x+0.8)+'" y="'+(y+3.3)+'">'+n+'</text>';}
  s+='<rect class="startzone" x="0" y="100" width="100" height="10"/><text class="num" x="2" y="106.2">START</text>';
  Object.keys(b.ladders).forEach(function(k){s+=ladderSVG(+k,b.ladders[k]);});
  Object.keys(b.snakes).forEach(function(k){s+=snakeSVG(+k,b.snakes[k]);});
  g.players.forEach(function(pl,i){var t=tokXY(pl,i);
    s+='<g class="tok" id="tok-'+pl.id+'" style="transform:translate('+t.x+'px,'+t.y+'px)"><circle r="'+(pl.isHuman?3.5:3.1)+'" class="t-'+pl.color+'"/><text class="tt-'+pl.color+'">'+esc(pl.initial)+'</text></g>';});
  return s+'</svg>';
}
function updateTokens(){
  if(!G){return;}
  G.players.forEach(function(pl,i){var el=document.getElementById('tok-'+pl.id);if(el){var t=tokXY(pl,i);el.style.transform='translate('+t.x+'px,'+t.y+'px)';}});
  var ul=$('#positions');if(ul){ul.innerHTML=positionsHTML();}
}
function positionsHTML(){
  return G.players.map(function(pl){
    return '<li><span class="dot d-'+pl.color+'" aria-hidden="true"></span><strong>'+esc(pl.name)+'</strong><span class="sq">'+(pl.pos===0?'at the start':'square '+pl.pos)+'</span></li>';}).join('');
}
function setStatus(t){var el=$('#status');if(el){el.textContent=t;}}
function pushHistory(t){
  G.history.unshift(t);if(G.history.length>30){G.history.pop();}
  var ol=$('#history');if(ol){ol.innerHTML=G.history.map(function(h){return '<li>'+esc(h)+'</li>';}).join('');}
}
function rollLabel(){return 'Roll the dice. You are '+posText(G.players[0].pos)+'.';}
function setBusy(b){
  var r=$('#roll');if(!r){return;}
  r.setAttribute('aria-disabled',b?'true':'false');
  r.setAttribute('aria-label',b?'Robots are playing. Please wait.':rollLabel());
  r.innerHTML=b?'Please wait':'Roll dice<span class="sub">You are '+posText(G.players[0].pos)+'</span>';
}
function startGame(){
  var p=me(),robots=DB.setup.robot==='all'?['B','C','D']:[DB.setup.robot];
  var players=[{id:'you',name:p.name,isHuman:true,initial:(p.name.trim()[0]||'Y').toUpperCase(),pos:0,color:'you'}].concat(
    robots.map(function(r){return {id:'r'+r,name:'Robot '+r,isHuman:false,initial:r,pos:0,color:r};}));
  G={boardKey:DB.setup.board,players:players,over:false,aborted:false,busy:false,intro:false,history:[],result:null};
}

function turnMessage(pl,r){
  var you=pl.isHuman,n=pl.name,f=r.final,m;
  if(r.won){
    m=you?'A '+r.roll+'! And you reach square 100! You win! What a fantastic game!'
         :n+' rolls a '+r.roll+' and reaches square 100. '+n+' wins this one!';
  }else if(r.event==='ladder'){
    m=you?pick(['You rolled a '+r.roll+' and land on square '+r.landed+'. A ladder! What a climb, all the way up to square '+f+'!','A '+r.roll+'! Square '+r.landed+' has a ladder. Up you go to square '+f+'!'])
         :n+' rolls a '+r.roll+', finds a ladder on square '+r.landed+', and climbs up to square '+f+'.';
  }else if(r.event==='snake'){
    m=you?pick(['You rolled a '+r.roll+' and land on square '+r.landed+'. Oh no, a snake! Sliding down to square '+f+'.','A '+r.roll+'. Oops, a snake on square '+r.landed+'! Down you slide to square '+f+'.'])
         :n+' rolls a '+r.roll+' and meets a snake on square '+r.landed+'. Ouch! Down to square '+f+'.';
  }else{
    m=you?pick(['You rolled a '+r.roll+'! Moving to square '+f+'.','A '+r.roll+'! You step forward to square '+f+'.','Rolled a '+r.roll+'. You are now on square '+f+'.'])
         :n+' rolls a '+r.roll+' and moves to square '+f+'.';
  }
  if(!r.won&&f>=90){m+=' Almost there, only '+(100-f)+' squares to go!';}
  return m;
}
async function introGame(g){
  var names=g.players.map(function(p){return p.name;});
  var txt='Hello and welcome to Snakes and Ladders! I am your commentator today. We are playing on the '+BOARDS[g.boardKey].name+'. Our players are '+names.join(', ')+'. Everyone begins at the start, and you go first. Press the Roll dice button when you are ready.';
  setStatus('Your turn. You are at the start.');
  pushHistory('Game started. You go first.');
  await say(txt);
}
async function playerTurn(g,pl){
  var board=BOARDS[g.boardKey],roll=1+Math.floor(Math.random()*6),r=takeTurn(board,pl.pos,roll);
  if(!pl.isHuman){setStatus(pl.name+' is playing…');}
  sfx.roll();await sleep(750);if(g.aborted||G!==g){return false;}
  for(var i=1;i<=roll;i++){pl.pos=Math.min(100,r.from+i);updateTokens();sfx.step(i);await sleep(140);if(g.aborted||G!==g){return false;}}
  if(r.event){
    await sleep(250);
    if(r.event==='ladder'){sfx.ladder();}else{sfx.snake();}
    pl.pos=r.final;updateTokens();await sleep(r.event==='snake'?850:650);if(g.aborted||G!==g){return false;}
  }
  pl.pos=r.final;updateTokens();
  var msg=turnMessage(pl,r);pushHistory(msg);setStatus(msg);
  await say(msg);
  if(g.aborted||G!==g){return false;}
  if(r.won){g.winner=pl;}
  return true;
}
async function doRoll(){
  var g=G;if(!g||g.busy||g.over){sfx.error();return;}
  g.busy=true;setBusy(true);
  for(var i=0;i<g.players.length;i++){
    var ok=await playerTurn(g,g.players[i]);
    if(!ok){return;}
    if(g.winner){break;}
  }
  if(g.winner){await finishGame(g);return;}
  g.busy=false;setBusy(false);
  var you=g.players[0];
  setStatus('Your turn. You are '+posText(you.pos)+'.');
  var rb=$('#roll');if(rb){rb.focus();}
  await say(pick(['Your turn. ','Over to you. ','Your roll. '])+'You are '+posText(you.pos)+'.');
}
async function finishGame(g){
  g.over=true;g.busy=false;
  var p=me(),you=g.players[0],won=g.winner===you,before=levelOf(p);
  p.played++;if(won){p.wins++;}else{p.losses++;}
  var after=levelOf(p),lvUp=after>before;
  if(lvUp){p.alerts=p.alerts||[];p.alerts.unshift({id:'lvl-'+DB.session+'-'+after,kind:'new',title:'You reached level '+after,body:'Stage: '+stageOf(after)+'. Keep winning to climb further.'});}
  save();
  var place=won?1:1+g.players.filter(function(x){return x.pos>you.pos;}).length;
  var toGo=WINS_PER_LEVEL-(p.wins%WINS_PER_LEVEL);
  var txt;
  if(won){txt='Game over. Congratulations, you finish in first place! You now have '+p.wins+' first-place wins. '+(lvUp?'Level up! You are now level '+after+', stage '+stageOf(after)+'. Well done!':toGo+' more first-place wins to reach level '+(after+1)+'.');}
  else{txt='Game over. '+g.winner.name+' takes the win. You finish in '+ORD[place-1]+' place, '+posText(you.pos)+'. Great effort! Your level stays at '+after+'.';}
  g.result='<section class="panel" aria-label="Game over"><p>'+esc(txt)+'</p><div class="stack">'+
    '<button type="button" class="btn primary" data-act="again">Play again</button><button type="button" class="btn" data-go="home">Back to home</button></div></section>';
  setStatus('Game over.');pushHistory(txt);
  var rb=$('#roll');if(rb){rb.hidden=true;}
  var slot=$('#result-slot');if(slot){slot.innerHTML=g.result;slot.focus();}
  if(won){sfx.win();}else{sfx.lose();}
  await sleep(600);
  await say(txt);
}
function nearby(pos){
  var b=BOARDS[G.boardKey],bestL=null,bestS=null;
  Object.keys(b.ladders).map(Number).sort(function(a,c){return a-c;}).forEach(function(k){if(k>pos&&bestL===null){bestL=k;}});
  Object.keys(b.snakes).map(Number).sort(function(a,c){return a-c;}).forEach(function(k){if(k>pos&&bestS===null){bestS=k;}});
  var t='';
  if(bestL!==null){t+=' Next ladder ahead: square '+bestL+' up to '+b.ladders[bestL]+', '+(bestL-pos)+' squares away.';}
  if(bestS!==null){t+=' Next snake ahead: square '+bestS+' down to '+b.snakes[bestS]+', '+(bestS-pos)+' squares away.';}
  return t;
}
function allPositions(){return G.players.map(function(p){return (p.isHuman?p.name+' is ':p.name+' is ')+posText(p.pos)+'.';}).join(' ');}
async function playTones(){
  var intro='Listen. A higher pitch means closer to square 100. The first tone is you. The others follow from left to right.';
  await say(intro);
  var pans=[0,-0.8,0.8,0.4];
  G.players.forEach(function(pl,i){
    var f=220*Math.pow(2,(pl.pos/100)*2);
    tone(f,i*0.7,0.5,pl.isHuman?'triangle':'sine',0.3,pans[i%4]);
  });
  await sleep(G.players.length*700+200);
  await say(allPositions());
}

/* ---------- update engine ---------- */
function vcmp(a,b){var x=String(a).split('.'),y=String(b).split('.'),n=Math.max(x.length,y.length);
  for(var i=0;i<n;i++){var d=(parseInt(x[i],10)||0)-(parseInt(y[i],10)||0);if(d){return d>0?1:-1;}}return 0;}
async function checkUpdate(manual){
  if(CHECKING){return 'busy';}
  if(!manual&&Date.now()-LAST_CHECK<60000){return 'skip';}
  CHECKING=true;LAST_CHECK=Date.now();var res='latest';
  try{
    var r=await fetch(VERSION_URL+'?t='+Date.now(),{cache:'no-store'});
    if(!r.ok){throw new Error('http');}
    var j=await r.json();
    if(j&&vcmp(j.version,APP_VERSION)>0){
      var same=UPDATE&&UPDATE.version===String(j.version);
      UPDATE={version:String(j.version),notes:(Array.isArray(j.notes)&&j.notes.length)?j.notes:['Improvements and fixes.'],dismissed:same?UPDATE.dismissed:false};
      res='available';
    }else{UPDATE=null;}
  }catch(e){res='failed';}
  CHECKING=false;return res;
}
function autoCheck(){checkUpdate(false).then(function(r){if(r==='available'){showPrompt();}});}
function showPrompt(){
  var box=$('#upd');
  if(!box||!UPDATE||UPDATE.dismissed||!box.hidden||currentRoute()==='game'){return;}
  PREV=document.activeElement;
  $('#upd-body').innerHTML='<p>Version '+esc(UPDATE.version)+' is ready. What is new:</p>'+notesList(UPDATE.notes);
  box.hidden=false;
  var w=$('.wrap');if(w){w.inert=true;}
  var sh=box.querySelector('.sheet');if(sh){sh.scrollTop=0;sh.focus();}
  if(DB.settings.voice){announce('Update available. Version '+UPDATE.version+'. What is new: '+UPDATE.notes.join(' ')+' Choose Update now or Later.');}
}
function hidePrompt(){
  var box=$('#upd');if(!box){return;}
  box.hidden=true;var w=$('.wrap');if(w){w.inert=false;}
  cancelSpeech();
}
function laterUpdate(){
  if(UPDATE){UPDATE.dismissed=true;}
  hidePrompt();
  var r=currentRoute();
  if(r==='explore'||r==='updates'){render();}
  else{try{if(PREV&&PREV.focus){PREV.focus();}}catch(e){}}
}
async function applyUpdate(){
  var done=false;
  try{
    if('serviceWorker' in navigator){
      var reg=await navigator.serviceWorker.getRegistration();
      if(reg){
        try{await reg.update();}catch(e){}
        var w=reg.waiting||reg.installing;
        if(w&&w.state!=='installed'){
          await new Promise(function(res){
            var t=setTimeout(res,8000);
            w.addEventListener('statechange',function(){if(w.state==='installed'||w.state==='redundant'||w.state==='activated'){clearTimeout(t);res();}});
          });
        }
        w=reg.waiting;
        if(w){
          await new Promise(function(res){
            var t=setTimeout(res,4000);
            navigator.serviceWorker.addEventListener('controllerchange',function(){clearTimeout(t);res();});
            w.postMessage('skip-waiting');
          });
          done=true;
        }
      }
    }
  }catch(e){}
  if(!done){try{var ks=await caches.keys();await Promise.all(ks.map(function(k){return caches.delete(k);}));}catch(e){}}
  location.reload();
}
actions['update-now']=function(el){
  if(el){el.setAttribute('aria-disabled','true');el.textContent='Updating…';}
  announce('Updating. The app will restart.');applyUpdate();
};
actions['update-check']=async function(){
  UPD_MSG='Checking for updates…';render();
  var r=await checkUpdate(true);
  if(currentRoute()!=='updates'){return;}
  UPD_MSG=r==='failed'?'Could not check for updates. Connect to the internet and try again.':'You have the latest version.';
  render();
  if(UPDATE){announce('Version '+UPDATE.version+' is ready. Choose Update now or Later.');}else{announce(UPD_MSG||'You have the latest version.');}
};

  var id=e.target.id,v=e.target.value,s=DB.settings;
  if(id==='set-primary'){s.primary=v;applyTheme();save();announce('Primary color set to '+PRIMARY[v].name+'.');}
  else if(id==='set-secondary'){s.secondary=v;applyTheme();save();announce('Secondary color set to '+SECONDARY[v].name+'.');}
  else if(id==='set-sound'){s.sound=e.target.checked;save();if(s.sound){sfx.chime();}announce(s.sound?'Sound effects on.':'Sound effects off.');}
  else if(id==='set-voice'){s.voice=e.target.checked;save();if(s.voice){announce('Spoken menu announcements on.');}else{live('Spoken menu announcements off. Menus are now read by your screen reader.');}}
  else if(id==='set-comm'){s.commentary=e.target.checked;save();if(s.commentary){COMM=true;announce('Game commentator voice on.');COMM=false;}else{live('Game commentator voice off. Game announcements now go to your screen reader.');}}
  else if(id==='set-rate'){s.rate=v;save();announce('Voice speed '+v+'.');}
  else if(id==='sel-board'){DB.setup.board=v;save();var d=$('#board-desc');if(d){d.textContent=boardDesc(v);}announce(BOARDS[v].name+'. '+boardDesc(v));}
  else if(id==='sel-robot'){DB.setup.robot=v;save();}
});
document.addEventListener('input',function(e){
  if(e.target.id==='set-volume'){DB.settings.volume=+e.target.value;var o=$('#vol-val');if(o){o.textContent=e.target.value;}save();}
});
document.addEventListener('submit',function(e){e.preventDefault();if(e.target.id==='ca-form'){actions['submit-account']();}});
/* Browser behaviours switched off: context menu, drag, text selection (inputs excepted) */
document.addEventListener('contextmenu',function(e){e.preventDefault();});
document.addEventListener('dragstart',function(e){e.preventDefault();});
document.addEventListener('selectstart',function(e){var t=e.target&&e.target.nodeType===1?e.target:e.target.parentElement;if(!t||!t.closest('input,textarea')){e.preventDefault();}});

applyTheme();
render();
})();
</script>
<script>
/* Hide the browser bars: installed app opens full screen by itself; in a normal tab the first tap asks for full screen. */
(function(){
  try{if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}}catch(e){}
  var standalone=false;try{standalone=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;}catch(e){}
  if(standalone){return;}
  function fs(){
    var el=document.documentElement,f=el.requestFullscreen||el.webkitRequestFullscreen;
    if(f){try{var r=f.call(el);if(r&&r.catch){r.catch(function(){});}}catch(e){}}
    document.removeEventListener('click',fs,true);
  }
  document.addEventListener('click',fs,true);
})();
</script>
